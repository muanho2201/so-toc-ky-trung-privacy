name: Publish private source APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-private-source-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Checkout private app source
        uses: actions/checkout@v4
        with:
          repository: muanho2201/so-toc-ky-trung
          ref: feature/offline-gemini-audio
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: app-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: app-source
        run: npm ci

      - name: Sync Capacitor
        working-directory: app-source
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s app-source/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app-source/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum app-source/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-latest
          name: Sổ Tốc Ký Trung - APK thử nghiệm
          prerelease: true
          make_latest: false
          files: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
